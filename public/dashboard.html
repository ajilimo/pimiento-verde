<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Task Coordinator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <span class="nav-brand">
        <img src="https://aji.limo/wp-content/uploads/2026/05/Logo-Aji-Limo.png" alt="Ají Limo" class="nav-logo">
        <span class="nav-brand-text">Task Coordinator</span>
      </span>
      <div class="nav-links">
        <a href="/">Nueva Tarea</a>
        <a href="/dashboard" class="active">Dashboard</a>
        <a href="/resumen">Resumen</a>
      </div>
    </div>
  </nav>

  <main class="container wide">
    <div class="dashboard-header">
      <h1>Dashboard</h1>
      <div style="display:flex;gap:0.5rem;align-items:center">
        <div class="view-toggle">
          <button id="viewKanban" class="view-btn active-view">Kanban</button>
          <button id="viewTable"  class="view-btn">Tabla</button>
        </div>
        <button id="refreshBtn" class="btn btn-secondary btn-sm">↻ Actualizar</button>
      </div>
    </div>

    <div class="filters">
      <select id="filterAssignee">
        <option value="">Todos los responsables</option>
      </select>
      <select id="filterPriority">
        <option value="">Todas las prioridades</option>
        <option value="high">Alta 🔴</option>
        <option value="medium">Media 🟡</option>
        <option value="low">Baja 🟢</option>
      </select>
      <input type="text" id="filterClient" placeholder="Filtrar por cliente...">
      <label class="show-archived-toggle">
        <input type="checkbox" id="showArchived"> Ver archivadas
      </label>
    </div>

    <div id="loading" class="loading">Cargando tareas...</div>

    <div class="kanban hidden" id="kanban">
      <div class="kanban-col">
        <div class="kanban-col-header status-pendiente">
          <span class="col-title">Pendiente</span>
          <span class="col-count" id="count-pendiente">0</span>
        </div>
        <div class="kanban-cards" id="col-pendiente"></div>
      </div>
      <div class="kanban-col">
        <div class="kanban-col-header status-en-desarrollo">
          <span class="col-title">En Desarrollo</span>
          <span class="col-count" id="count-en-desarrollo">0</span>
        </div>
        <div class="kanban-cards" id="col-en-desarrollo"></div>
      </div>
      <div class="kanban-col">
        <div class="kanban-col-header status-en-pausa">
          <span class="col-title">En Pausa</span>
          <span class="col-count" id="count-en-pausa">0</span>
        </div>
        <div class="kanban-cards" id="col-en-pausa"></div>
      </div>
      <div class="kanban-col">
        <div class="kanban-col-header status-listo">
          <span class="col-title">Listo ✓</span>
          <span class="col-count" id="count-listo">0</span>
        </div>
        <div class="kanban-cards" id="col-listo"></div>
      </div>
    </div>

    <div id="table-view" class="hidden">
      <table class="tasks-table">
        <thead>
          <tr>
            <th>Título</th>
            <th>Cliente</th>
            <th>Responsable</th>
            <th>Estado</th>
            <th>Fecha límite</th>
            <th>Prioridad</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div id="empty-state" class="empty-state hidden">
      <p>No hay tareas que coincidan con los filtros.</p>
      <a href="/" class="btn btn-primary" style="margin-top:1rem;display:inline-flex">+ Nueva Tarea</a>
    </div>
  </main>

  <div id="task-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <span id="modal-title" class="modal-title"></span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
